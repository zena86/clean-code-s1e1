<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <header class="hero">
    <img class="hero__pic" src="./eisenhower-matrix.jpg" alt="the Eisenhower Matrix">
    <a class="hero__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="main">
    <section>
      <h3 class="title">Add Item</h3>
      <div class="add">
        <input id="new-task"class="add__task task input-task" type="text">
        <button class="add__btn btn">Add</button>
      </div>
    </section>
    <section>
      <h3 class="title">Todo</h3>
      <ul id="incompleted">
        <li class="todo">
          <input type="checkbox" class="todo__checkbox">
          <label class="task todo__label">Pay Bills</label>
          <input type="text" class="todo__task task input-task">
          <button class="todo__edit btn">Edit</button>
          <button class="todo__delete btn">
            <img src="./remove.svg" alt="delete" class="todo__icon">
          </button>
        </li>
        <li class="todo editing">
          <input type="checkbox" class="todo__checkbox">
          <label class="task todo__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="todo__task task input-task">
          <button class="todo__edit btn">Save</button>
          <button class="todo__delete btn">
            <img src="./remove.svg" alt="delete" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>
    <section>
      <h3 class="title">Completed</h3>
      <ul id="completed">
        <li class="todo">
          <input type="checkbox" checked class="todo__checkbox">
          <label class="task todo__label">See the Doctor</label>
          <input type="text" class="todo__task task input-task">
          <button class="todo__edit btn">Edit</button>
          <button class="todo__delete btn">
            <img src="./remove.svg" alt="delete" class="todo__icon">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
